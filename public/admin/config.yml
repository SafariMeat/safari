backend:
  name: github
  repo: SafariMeat/safari
  branch: main
  base_url: https://safari-orpin.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/product"
public_folder: "/images/product"

collections:
  - name: "pages"
    label: "Site Content"
    files:
      - file: "src/content/home/home.md"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/about/about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/contact/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - label: "WhatsApp number"
            name: "whatsapp"
            widget: "string"
            hint: "International format, digits only, no + or spaces (e.g. 254700000000). Used for all WhatsApp order/enquiry links across the site."
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Business hours", name: "hours", widget: "string" }
      - file: "src/content/certification/certification.md"
        label: "Export & Certification Page"
        name: "certification"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/markets/markets.md"
        label: "Export Markets Page"
        name: "markets"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/product/product.md"
        label: "Product Specification"
        name: "product"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Product name", name: "name", widget: "string" }
          - { label: "Minimum typical weight (kg)", name: "weightMinKg", widget: "number", value_type: "float", min: 0 }
          - { label: "Maximum typical weight (kg)", name: "weightMaxKg", widget: "number", value_type: "float", min: 0 }
          - { label: "Form", name: "form", widget: "string" }
          - { label: "Processing", name: "processing", widget: "string" }
          - label: "Packaging options"
            name: "packagingOptions"
            widget: "list"
            field: { label: "Option", name: "option", widget: "string" }
          - { label: "Product image", name: "image", widget: "image", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
      - file: "src/content/exportProcess/exportprocess.md"
        label: "Our Export Process Page"
        name: "export-process"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/gallery/gallery.md"
        label: "Gallery Page"
        name: "gallery"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/quote/quote.md"
        label: "Request a Quotation Page"
        name: "quote"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/legal/privacy.md"
        label: "Privacy Policy Page"
        name: "privacy"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
      - file: "src/content/legal/terms.md"
        label: "Terms & Conditions Page"
        name: "terms"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }